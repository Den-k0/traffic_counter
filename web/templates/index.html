<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Traffic Counter Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="mt-4">
    <div class="container">
        <h2 class="mb-4 text-center fw-bold text-white">🚦 Traffic Counter</h2>
        
        <div class="row justify-content-center">
            <div class="col-lg-8 video-container">
                <img src="/video_feed" class="img-fluid border border-secondary rounded shadow" alt="Live Video" style="width: 100%; max-height: 50vh; object-fit: cover;">
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10 chart-container shadow mb-5">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0 text-white">Статистика руху</h4>
                    <div class="text-end">
                        <span class="me-3 text-light fs-5 align-middle">Всього: <strong id="total" class="text-white fs-3 ms-1">0</strong></span>
                        <span id="state" class="state-badge text-success align-middle">FREE</span>
                    </div>
                </div>

                <canvas id="trafficChart" height="80"></canvas>

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 pt-3 border-top border-dark">
                    <div class="btn-group mb-3 mb-md-0 shadow-sm" role="group" id="type-filters">
                        <button type="button" class="btn btn-outline-success active" onclick="setType('all', event)">Всі</button>
                        <button type="button" class="btn btn-outline-success" onclick="setType('transport', event)">Транспорт</button>
                        <button type="button" class="btn btn-outline-success" onclick="setType('person', event)">Люди</button>
                    </div>

                    <div class="btn-group shadow-sm flex-wrap" role="group" id="time-filters">
                        <button type="button" class="btn btn-outline-success active" onclick="setMode('1min', event)">1 хв</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setMode('15min', event)">15 хв</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setMode('hour', event)">Година</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setMode('day', event)">День</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setMode('week', event)">Тиждень</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setMode('month', event)">Місяць</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setMode('year', event)">Рік</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
