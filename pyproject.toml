[project]
name = "TrafficCounter"
version = "0.1.0"
description = "Система аналізу трафіку через Raspberry Pi та YOLOv8"
authors = [
    {name = "Den_k0", email = "denys.kotovskiy@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lapx>=0.9.4",
  "coremltools",
  "opencv-python>=4.13.0.92",
  "ultralytics>=8.4.60",
  "imutils>=0.5.4",
  "python-dotenv>=1.2.2",
  "paramiko>=5.0.0",
  "numpy>=2.3.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 79
exclude = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # PEP8 naming conventions
]
ignore = ["I001", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"
